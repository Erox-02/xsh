[package]
name = "xsh"
version = "0.0.9"
edition = "2024"
repository = "https://github.com/Erox-02/xsh"
license = "GPL-3.0-only"
readme = "README.md"
description = "A minimal shell in rust"

[dependencies]
crossterm = "0.29.0"
glob = "0.3.4"
regex = "1.13.1"
serde = { version = "1.0", features = ["derive"]}
shlex = "2.0.1"
toml = "1.1.8"
